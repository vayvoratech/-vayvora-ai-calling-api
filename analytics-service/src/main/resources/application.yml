spring:
  application:
    name: analytics-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/vayvora_db}
    username: ${DB_USERNAME:vayvora}
    password: ${DB_PASSWORD:vayvora_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: analytics-service-group
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8006

logging:
  level:
    root: INFO
    com.vayvora: DEBUG
