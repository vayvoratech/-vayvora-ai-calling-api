spring:
  application:
    name: knowledge-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/vayvora_db}
    username: ${DB_USERNAME:vayvora}
    password: ${DB_PASSWORD:vayvora_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8007

logging:
  level:
    root: INFO
    com.vayvora: DEBUG
