spring:
  application:
    name: agent-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/vayvora_db}
    username: ${DB_USERNAME:vayvora}
    password: ${DB_PASSWORD:vayvora_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

server:
  port: 8003

logging:
  level:
    root: INFO
    com.vayvora: DEBUG
