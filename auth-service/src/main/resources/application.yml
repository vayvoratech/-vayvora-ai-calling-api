spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/vayvora_db}
    username: ${DB_USERNAME:vayvora}
    password: ${DB_PASSWORD:vayvora_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
      timeout: 60000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: auth-service-group
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8001

jwt:
  secret: ${JWT_SECRET:your_super_secret_jwt_key_change_in_production}
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    root: INFO
    com.vayvora: DEBUG
